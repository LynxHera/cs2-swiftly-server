services:
  cs2:
    build: .
    restart: unless-stopped
    environment:
      CS2_PORT: "27015"
      CS2_MAXPLAYERS: "10"
      CS2_MAP: "de_dust2"
      CS2_GSLT: "${CS2_GSLT:-}"
      CS2_HOSTNAME: "Coolify CS2 SwiftlyS2"
      CS2_UPDATE_ON_START: "0"
      SWIFTLY_UPDATE_ON_START: "0"
      SWIFTLY_ENABLED: "${SWIFTLY_ENABLED:-1}"
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - cs2_steamapps:/home/steam/Steam/steamapps
    stop_grace_period: 45s
volumes:
  cs2_steamapps:
